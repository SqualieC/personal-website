backend:
  name: github
  repo: SqualieC/personal-website
  branch: main
  base_url: https://decap-oauth.squaliekid55.workers.dev

media_folder: public/uploads
public_folder: /uploads

collections:
  # ── Blog Posts ──────────────────────────────────────────────────────────────
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Updated At, name: updatedAt, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Tags, name: tags, widget: list, default: [], field: { label: Tag, name: tag, widget: string } }
      - { label: Body, name: body, widget: markdown }

  # ── Tools ───────────────────────────────────────────────────────────────────
  - name: tools
    label: Tools
    folder: src/content/tools
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Updated At, name: updatedAt, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Tags, name: tags, widget: list, default: [], field: { label: Tag, name: tag, widget: string } }
      - { label: Body, name: body, widget: markdown }

  # ── Projects ─────────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Pitch, name: pitch, widget: text }
      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
      - { label: Status, name: status, widget: select, options: [planning, active, paused, archived], default: active }
      - { label: Screenshots, name: screenshots, widget: list, default: [], field: { label: Path, name: screenshot, widget: string } }
      - { label: Repo URL, name: repoUrl, widget: string, required: false, hint: "Full https:// URL" }
      - { label: Demo URL, name: demoUrl, widget: string, required: false, hint: "Full URL or root-relative /path" }
      - { label: Download URL, name: downloadUrl, widget: string, required: false }
      - { label: Download Label, name: downloadLabel, widget: string, required: false }
      - { label: Secondary Download URL, name: secondaryDownloadUrl, widget: string, required: false }
      - { label: Secondary Download Label, name: secondaryDownloadLabel, widget: string, required: false }
      - { label: Platform, name: platform, widget: select, multiple: true, options: [web, windows, mac, linux, android, ios] }
      - { label: Updated At, name: updatedAt, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Uses Mic/Audio, name: usesMicAudio, widget: boolean, default: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  # ── Photo Sets ───────────────────────────────────────────────────────────────
  # Images live in src/assets/photo-sets/ (not public/) so Astro's image()
  # content-collection helper can import + optimize them at build time.
  # media_folder/public_folder are a single FLAT relative folder (no
  # leading slash, no {{slug}}). {{slug}} in a folder collection's
  # media_folder proved unreliable in practice — it templated correctly for
  # where the file was physically written, but not for the path string
  # saved into frontmatter, producing a broken reference. A static path
  # avoids that mismatch entirely, and the nested Image field below repeats
  # the exact same value explicitly (nested fields don't reliably inherit
  # the collection-level setting) so there's no ambiguity.
  #
  # There's no separate "cover" field — photos[0] is used as the set's
  # thumbnail on /photos, so drag the photo you want as the thumbnail to the
  # top of this list.
  - name: photoSets
    label: Photo Sets
    folder: src/content/photoSets
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    media_folder: "../../assets/photo-sets"
    public_folder: "../../assets/photo-sets"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Note, name: note, widget: text, required: false, hint: "Short blurb shown on the set page" }
      - label: Photos
        name: photos
        widget: list
        label_singular: Photo
        summary: "{{fields.title}}"
        hint: "The FIRST photo here is used as the set's cover thumbnail on /photos — drag to reorder. Each photo can have its own title and the date/time it was taken, shown when a viewer clicks it open."
        fields:
          - { label: Image, name: image, widget: image, media_folder: "../../assets/photo-sets", public_folder: "../../assets/photo-sets" }
          - { label: Photo Title, name: title, widget: string, required: false }
          - { label: Date/Time Taken, name: takenAt, widget: datetime, required: false }

  # ── About Page ───────────────────────────────────────────────────────────────
  - name: about
    label: About Page
    files:
      - label: About
        name: about
        file: src/content/about/about.mdx
        media_folder: "../../assets/about"
        public_folder: "../../assets/about"
        fields:
          - { label: Title, name: title, widget: string, default: About }
          - { label: Tagline, name: tagline, widget: text, required: false, hint: "Shown under the heading" }
          - { label: Portrait, name: photo, widget: image, required: false }
          - { label: Updated At, name: updatedAt, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - { label: Body, name: body, widget: markdown }

  # ── Site Settings ────────────────────────────────────────────────────────────
  - name: settings
    label: Site Settings
    files:
      - label: Global Settings
        name: global
        file: src/content/site/global.json
        fields:
          - { label: Hero Heading, name: heroHeading, widget: string, hint: "Main H1 on the homepage" }
          - { label: Hero Subtext, name: heroSubtext, widget: text, hint: "Lead paragraph under the hero heading" }
          - { label: Site Tagline, name: siteTagline, widget: string, hint: "Homepage browser tab title" }
          - { label: Default OG Description, name: defaultOgDescription, widget: text, hint: "Fallback meta description for pages without their own" }
          - { label: Default Page Title, name: defaultTitleSuffix, widget: string, hint: "Fallback <title> used in Layout.astro" }
